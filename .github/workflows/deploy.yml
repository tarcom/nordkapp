name: Deploy til aogj.com/nordkapp

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'deploy.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Ét deploy ad gangen — to samtidige FTP-uploads til samme mappe kan
# efterlade halve filer.
concurrency:
  group: deploy-nordkapp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # deploy.py bruger kun standardbiblioteket, så der er intet at installere.
      - name: Upload site/ via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python deploy.py
